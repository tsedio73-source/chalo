<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chalo — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="shared/theme.css" />
<style>
  body { padding: 0; }
  #pinGate { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); }
  #pinGate input { max-width: 200px; text-align: center; letter-spacing: 6px; font-size: 20px; }
  #app { display: none; max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .brand span { color: var(--accent); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card .num { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  #map { width: 100%; height: 300px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); padding: 8px 16px; border-radius: 100px; font-size: 13px; }
  .tab-btn.active { background: var(--accent); color: #14100C; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-badge { padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .status-requested { background: rgba(245,192,67,0.15); color: var(--warn); }
  .status-accepted, .status-arrived, .status-ongoing { background: rgba(0,194,168,0.15); color: var(--live); }
  .status-completed { background: rgba(255,255,255,0.08); color: var(--text-dim); }
  .status-cancelled { background: rgba(255,71,87,0.15); color: var(--danger); }
  .mini-btn { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<div id="pinGate">
  <div class="display" style="font-size:26px;">Chalo<span style="color:var(--accent)">.</span> Admin</div>
  <input id="pinInput" placeholder="PIN" type="password" inputmode="numeric" />
  <button class="btn-primary" style="width:160px;" onclick="checkPin()">Login</button>
  <div class="hint" id="pinError" style="color:var(--danger); font-size:12px;"></div>
</div>

<div id="app">
  <header>
    <div class="brand">Chalo<span>.</span> Admin</div>
    <button class="btn-secondary" onclick="location.reload()">Logout</button>
  </header>

  <div class="stats-grid">
    <div class="card stat-card"><div class="num" id="statOnlineDrivers">0</div><div class="label">Online Drivers</div></div>
    <div class="card stat-card"><div class="num" id="statActiveRides">0</div><div class="label">Active Rides</div></div>
    <div class="card stat-card"><div class="num" id="statTodayRides">0</div><div class="label">Aaj ki Rides</div></div>
    <div class="card stat-card"><div class="num" id="statTodayRevenue">₹0</div><div class="label">Aaj ka Revenue</div></div>
  </div>

  <div id="map"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="rides" onclick="switchTab('rides')">Rides</button>
    <button class="tab-btn" data-tab="drivers" onclick="switchTab('drivers')">Drivers</button>
    <button class="tab-btn" data-tab="riders" onclick="switchTab('riders')">Riders</button>
  </div>

  <div class="card table-wrap">
    <div id="ridesTab">
      <table>
        <thead><tr><th>Rider</th><th>Driver</th><th>Distance</th><th>Fare</th><th>Status</th></tr></thead>
        <tbody id="ridesBody"></tbody>
      </table>
    </div>
    <div id="driversTab" style="display:none;">
      <table>
        <thead><tr><th>Naam</th><th>Vehicle</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="driversBody"></tbody>
      </table>
    </div>
    <div id="ridersTab" style="display:none;">
      <table>
        <thead><tr><th>Naam</th><th>Action</th></tr></thead>
        <tbody id="ridersBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { auth, db, signInAnonymously, onAuthStateChanged, ref, update, onValue, get } from "./shared/firebase-config.js";
  import { decryptLocation } from "./shared/crypto.js";

  const ADMIN_PIN = "2580"; // <-- ise apna PIN bana lo, ya Firebase mein `admins/pin` node se bhi check kar sakte ho

  window.checkPin = function () {
    const val = document.getElementById('pinInput').value.trim();
    if (val === ADMIN_PIN) {
      document.getElementById('pinGate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      boot();
    } else {
      document.getElementById('pinError').textContent = 'Galat PIN';
    }
  };

  let map, markers = {};

  function boot() {
    signInAnonymously(auth).catch(err => console.error(err));
    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([26.85, 80.95], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      watchDrivers();
      watchRides();
      watchRiders();
    });
  }

  window.switchTab = function (tab) {
    ['rides', 'drivers', 'riders'].forEach(t => {
      document.getElementById(`${t}Tab`).style.display = t === tab ? 'block' : 'none';
      document.querySelector(`.tab-btn[data-tab="${t}"]`).classList.toggle('active', t === tab);
    });
  };

  function watchDrivers() {
    onValue(ref(db, 'drivers'), async (snap) => {
      const drivers = snap.val() || {};
      let onlineCount = 0;
      const body = document.getElementById('driversBody');
      body.innerHTML = '';

      for (const [uid, d] of Object.entries(drivers)) {
        if (d.online) onlineCount++;

        // map marker
        if (d.online && d.location) {
          const loc = await decryptLocation(d.location);
          if (loc) {
            if (!markers[uid]) markers[uid] = L.circleMarker([loc.lat, loc.lng], { radius: 7, color: '#00C2A8', fillColor: '#00C2A8', fillOpacity: 1 }).addTo(map).bindTooltip(d.name || 'Driver');
            else markers[uid].setLatLng([loc.lat, loc.lng]);
          }
        } else if (markers[uid]) {
          map.removeLayer(markers[uid]);
          delete markers[uid];
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.name || '-'}</td>
          <td>${d.vehicleNumber || '-'}</td>
          <td><span class="status-badge ${d.online ? 'status-ongoing' : 'status-completed'}">${d.banned ? 'Banned' : (d.online ? 'Online' : 'Offline')}</span></td>
          <td><button class="btn-secondary mini-btn">${d.banned ? 'Unban' : 'Ban'}</button></td>
        `;
        tr.querySelector('button').onclick = () => update(ref(db, `drivers/${uid}`), { banned: !d.banned });
        body.appendChild(tr);
      }
      document.getElementById('statOnlineDrivers').textContent = onlineCount;
    });
  }

  function watchRiders() {
    onValue(ref(db, 'riders'), (snap) => {
      const riders = snap.val() || {};
      const body = document.getElementById('ridersBody');
      body.innerHTML = '';
      Object.entries(riders).forEach(([uid, r]) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.name || '-'}</td><td><button class="btn-secondary mini-btn">${r.banned ? 'Unban' : 'Ban'}</button></td>`;
        tr.querySelector('button').onclick = () => update(ref(db, `riders/${uid}`), { banned: !r.banned });
        body.appendChild(tr);
      });
    });
  }

  function watchRides() {
    onValue(ref(db, 'rides'), (snap) => {
      const rides = snap.val() || {};
      const body = document.getElementById('ridesBody');
      body.innerHTML = '';
      let activeCount = 0, todayCount = 0, todayRevenue = 0;
      const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);

      const sorted = Object.entries(rides).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
      sorted.forEach(([id, ride]) => {
        if (['accepted', 'arrived', 'ongoing', 'requested'].includes(ride.status)) activeCount++;
        if (ride.status === 'completed' && ride.completedAt >= startOfDay.getTime()) {
          todayCount++; todayRevenue += ride.fare;
        }
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${ride.riderName || '-'}</td>
          <td>${ride.driverName || '-'}</td>
          <td>${ride.distanceKm ? ride.distanceKm + ' km' : '-'}</td>
          <td>₹${ride.fare || 0}</td>
          <td><span class="status-badge status-${ride.status}">${ride.status}</span></td>
        `;
        body.appendChild(tr);
      });
      document.getElementById('statActiveRides').textContent = activeCount;
      document.getElementById('statTodayRides').textContent = todayCount;
      document.getElementById('statTodayRevenue').textContent = `₹${todayRevenue}`;
    });
  }
</script>
</body>
</html>
